name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tests -v
      - run: node --check assets/annotation.js
      - run: python3 scripts/inject_annotation.py examples/demo.html --lang en --zip
      - run: python3 scripts/validate_annotation.py examples/demo_reviewable.html
